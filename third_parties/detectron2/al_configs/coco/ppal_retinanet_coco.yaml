
# Paths
CONFIG_DIR: 'configs/coco_active_learning/'
WORK_DIR: 'output_al/'
IMG_ROOT: ''  # 'datasets/coco/train2017/'

SEED: 1234

# Environment setting
PYTHON_PATH: 'python'
PORT: 29500
GPUS: 1

# Config setting
TRAIN_CONFIG: ''    # defined in script
UNCERTAINTY_INFER_CONFIG: '' # defined in script
DIVERSITY_INFER_CONFIG: "" # defined in script

# Active learning setting
ROUND_NUM : 5
BUDGET: 2365
BUDGET_EXPAND_RATIO: 4

OUTPUT_DIR: '' # ${WORK_DIR}/retinanet_coco_ppal_5rounds_2percent_to_10percent

# Data setting
ORACLE_PATH: 'datasets/coco/annotations/instances_train2017.json'
INIT_LABELED_JSON: 'datasets/active_learning/coco/coco_2365_labeled_1.json'
INIT_UNLABELED_JSON: 'datasets/active_learning/coco/coco_2365_unlabeled_1.json'
INIT_MODEL : None


# Sampler config
UNCERTAINTY_SAMPLER_CONFIG:
  
  n_sample_images: None   # defined in script
  oracle_annotation_path: None  #${ORACLE_PATH}
  score_thr: 0.05
  class_weight_ub: 0.2
  class_weight_alpha: 0.3
  dataset_type: 'coco'
  NAME: DCUSSampler

DIVERSITY_SAMPLER_CONFIG:
  n_sample_images: None
  oracle_annotation_path: None    #${ORACLE_PATH}
  dataset_type: 'coco'
  NAME: DiversitySampler