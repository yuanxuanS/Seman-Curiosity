_BASE_: "../Base-RCNN-FPN.yaml"
MODEL:
  META_ARCHITECTURE: "PruneRCNN"
  WEIGHTS: "detectron2://ImageNetPretrained/MSRA/R-50.pkl"
  
  MASK_ON: True
  RESNETS:
    DEPTH: 50
  # NUM_CLASSES: 5
  ROI_HEADS:
    SCORE_THRESH_TEST: 0.5

DATASETS:
  TRAIN: ("embodied_testtrain_dl",)  # 
  TEST: ("embodied_test",)
DATASET_NAME: "embodied"    # 

SOLVER:
  IMS_PER_BATCH: 16
  BASE_LR: 0.01  # Note that RetinaNet uses a different default learning rate
  STEPS: (10000, ) # (60000, 80000)     
  MAX_ITER: 3696  #3936  #3926 # 3696 # 2430  # 15000   # 2062  # 

VIS: False

# for train
INPUT:
  MASK_FORMAT: "bitmask"