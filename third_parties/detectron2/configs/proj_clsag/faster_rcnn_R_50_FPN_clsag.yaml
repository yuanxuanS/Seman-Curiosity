_BASE_: "../Base-RCNN-FPN.yaml"
AdverTrain: True
MODEL:
  META_ARCHITECTURE: AdverRCNN
  WEIGHTS: "detectron2://ImageNetPretrained/MSRA/R-50.pkl"
  # "/home/wpp/Seman-Curiosity/third_parties/detectron2/output/7/model_0004999.pth"
  # 
  MASK_ON: False
  RESNETS:
    DEPTH: 50
  ROI_HEADS:
    NAME: AdverROIHeads
    NUM_CLASSES: 1
    SCORE_THRESH_TEST: 0.5
INPUT:
  MIN_SIZE_TRAIN: (480, 512, 544, 576, 608, 640, 672, 704, 736, 768, 800)
  MIN_SIZE_TEST: 800
DATASETS:
  TRAIN: ('proj_clsag_test',)   # name of dataset
  TEST: ('proj_clsag_test', )    # ('voc_clsag_val_seen','voc_clsag_val_unseen',)
SOLVER:
  BASE_LR: 0.001
  STEPS: (12000, 16000)
  MAX_ITER: 18000  # 17.4 epochs
  WARMUP_ITERS: 100

DATASET_NAME: proj_clsag
VIS: True
OUTPUT_DIR: "./output/test_clsag/"
OUTPUT_VISDIR: "vis_pred/"