_BASE_: "../Base-RCNN-FPN.yaml"
MODEL:
  META_ARCHITECTURE: "PruneRCNN"
  WEIGHTS: "detectron2://ImageNetPretrained/MSRA/R-50.pkl"
  MASK_ON: False
  RESNETS:
    DEPTH: 50
  ROI_HEADS:
    IOU_THRESHOLDS: [0.5]
  DEVICE: "cuda:1"

  
DATASETS:
  TRAIN: ("proj_train",)
  TEST: ("proj_train",)
DATASET_NAME: "proj"    # 

SOLVER:
  IMS_PER_BATCH: 16
  BASE_LR: 0.01  # Note that RetinaNet uses a different default learning rate
  STEPS: (60000, 80000)     
  MAX_ITER: 510     #90000   # 

VIS: False

# for train
INPUT:
  MASK_FORMAT: "bitmask"