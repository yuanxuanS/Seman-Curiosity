ENVIRONMENT:
  MAX_EPISODE_STEPS: 500  #100000
SIMULATOR:
  TURN_ANGLE: 30
  TILT_ANGLE: 30
  CAMERA_TURN_ANGLE: 15
  CAMERA_TILT_ANGLE: 15
  RELATIVE_ANGLE_LIMIT: 90
  CAMERA_PITCH_LIMIT: 60
  ACTION_SPACE_CONFIG: "v1"
  AGENT_0:
    SENSORS: ['RGB_SENSOR', 'DEPTH_SENSOR', 'SEMANTIC_SENSOR']
    HEIGHT: 0.88
    RADIUS: 0.08    # 0.18
  HABITAT_SIM_V0:
    GPU_DEVICE_ID: 0
    ALLOW_SLIDING: True 
  SEMANTIC_SENSOR:
    WIDTH: 640
    HEIGHT: 480
    HFOV: 79
    POSITION: [0, 0.88, 0]
  RGB_SENSOR:
    WIDTH: 640
    HEIGHT: 480
    HFOV: 79
    POSITION: [0, 0.88, 0]
  DEPTH_SENSOR:
    WIDTH: 640
    HEIGHT: 480
    HFOV: 79
    MIN_DEPTH: 0.5
    MAX_DEPTH: 5.0
    POSITION: [0, 0.88, 0]
TASK:
  TYPE: ObjectNav-v1
  POSSIBLE_ACTIONS: ["STOP", "MOVE_FORWARD", "TURN_LEFT", "TURN_RIGHT", "CAMERA_CAPTURE", "CAMERA_LEFT", "CAMERA_RIGHT", "CAMERA_UP", "CAMERA_DOWN"]
  SENSORS: ['GPS_SENSOR', 'COMPASS_SENSOR', 'OBJECT_DETECTOR_GT_SENSOR', 'AGENT_POSITION_SENSOR',]
  OBJECT_DETECTOR_GT_SENSOR:
    TYPE: object_detector_gt
  AGENT_POSITION_SENSOR:
    TYPE: position_sensor
  MEASUREMENTS: ['DISTANCE_TO_GOAL', 'SUCCESS', 'SPL']
  SUCCESS:
    SUCCESS_DISTANCE: 0.2

DATASET:
  TYPE: PointNav-v1
  SPLIT: train
